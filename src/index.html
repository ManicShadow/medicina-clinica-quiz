const Q=[
["Cardiologie","Pacient cu STEMI, la care PCI primară poate fi efectuată în sub 120 de minute. Care este strategia de reperfuzie preferată?",["Tromboliză intravenoasă","Angioplastie coronariană primară (PCI)","Beta-blocant intravenos","Anticoagulare orală și externare"],1,"PCI primară este strategia preferată în STEMI dacă este disponibilă în timp util; tromboliza se folosește când PCI nu poate fi realizată rapid."],
["Cardiologie","Scorul CHA₂DS₂-VASc se utilizează în fibrilația atrială pentru:",["Evaluarea riscului de sângerare","Evaluarea riscului tromboembolic și indicația de anticoagulare","Alegerea între cardioversie și ablație","Estimarea fracției de ejecție"],1,"CHA₂DS₂-VASc estimează riscul de AVC embolic; riscul hemoragic se evaluează cu HAS-BLED."],
["Cardiologie","Care dintre următoarele NU reduce mortalitatea în insuficiența cardiacă cu fracție de ejecție redusă?",["IECA / sacubitril-valsartan","Beta-blocant (bisoprolol)","Antagonist de aldosteron","Digoxin"],3,"Digoxinul ameliorează simptomele și reduce spitalizările, dar nu are efect dovedit asupra mortalității. SGLT2i reduc și ei mortalitatea."],
["Pneumologie","Criteriul spirometric pentru diagnosticul BPOC este:",["VEMS/CVF > 0,7","VEMS/CVF < 0,7 post-bronhodilatator","CVF scăzută cu raport normal","Creștere a VEMS cu >12% după bronhodilatator"],1,"Obstrucția persistentă (VEMS/CVF < 0,7 post-bronhodilatator) definește BPOC; reversibilitatea marcată sugerează astm."],
["Pneumologie","Cel mai frecvent agent etiologic al pneumoniei comunitare este:",["Staphylococcus aureus","Streptococcus pneumoniae","Klebsiella pneumoniae","Pseudomonas aeruginosa"],1,"Pneumococul rămâne cauza cea mai frecventă de pneumonie comunitară bacteriană."],
["Pneumologie","Pacient cu pneumotorax sub tensiune (hipotensiune, deviație traheală, torace hipertimpanic). Conduita imediată:",["Radiografie toracică de urgență","Decompresie imediată cu ac / dren pleural","CT toracic","Oxigen și observare"],1,"Pneumotoraxul sub tensiune este diagnostic clinic; se tratează imediat prin decompresie, fără a aștepta imagistica."],
["Pneumologie","Medicația de salvare (la nevoie) în astmul bronșic este:",["Corticosteroid inhalator","SABA (salbutamol)","Antileucotrienă orală","Teofilină retard"],1,"Beta-2 agonistul cu durată scurtă de acțiune ameliorează rapid bronhospasmul."],
["Gastroenterologie","Schema clasică de eradicare a H. pylori conține:",["IPP + claritromicină + amoxicilină (sau metronidazol)","IPP + ciprofloxacină","Anti-H2 + vancomicină","Sucralfat + doxiciclină"],0,"Terapia triplă standard: IPP plus două antibiotice, timp de 7–14 zile."],
["Gastroenterologie","Afectare transmurală, leziuni discontinue („skip lesions”) și granuloame necazeificate sugerează:",["Colită ulcerativă","Boala Crohn","Colită ischemică","Colită pseudomembranoasă"],1,"Boala Crohn poate afecta orice segment al tubului digestiv, transmural, cu leziuni segmentare."],
["Gastroenterologie","Anticorpii antimitocondriali (AMA) sunt markerul:",["Hepatitei autoimune","Colangitei biliare primitive","Colangitei sclerozante primitive","Bolii celiace"],1,"AMA sunt prezenți la peste 90% dintre pacienții cu colangită biliară primitivă (fostă ciroză biliară primitivă)."],
["Nefrologie","Cea mai frecventă cauză de boală renală cronică în lume este:",["Glomerulonefrita cronică","Diabetul zaharat","Boala polichistică","Pielonefrita cronică"],1,"Nefropatia diabetică, urmată de cea hipertensivă, domină etiologia BRC."],
["Nefrologie","Hiperkaliemie severă cu modificări ECG. Primul tratament:",["Insulină + glucoză","Gluconat de calciu intravenos","Hemodializă","Furosemid oral"],1,"Calciul stabilizează membrana miocardică (cardioprotecție). Apoi insulină + glucoză, salbutamol, eliminarea potasiului."],
["Endocrinologie","Hipertiroidismul autoimun (boala Graves) este mediat de:",["Anticorpi anti-peroxidază","Anticorpi stimulatori ai receptorului TSH","Anticorpi anti-tiroglobulină","Anticorpi anti-receptor ACTH"],1,"În boala Graves, anticorpii stimulează receptorul TSH; clinic: gușă difuză, exoftalmie, mixedem pretibial."],
["Endocrinologie","Tabloul hiperpigmentare, hipotensiune, hiponatremie, hiperkaliemie și hipoglicemie indică:",["Sindrom Cushing","Boala Addison","Feocromocitom","Hiperaldosteronism primar"],1,"Insuficiența suprarenală primară: deficit de cortizol și aldosteron, cu ACTH crescut (hiperpigmentare)."],
["Endocrinologie","Cea mai frecventă cauză de hipercalcemie la pacienții din ambulatoriu este:",["Neoplasm cu metastaze osoase","Hiperparatiroidismul primar","Sarcoidoza","Intoxicația cu vitamina D"],1,"Hiperparatiroidismul primar în ambulatoriu; malignitatea predomină la pacienții internați."],
["Diabet zaharat","Metforminul este contraindicat când:",["HbA1c > 7%","eGFR < 30 ml/min/1,73 m²","Indice de masă corporală > 30","Vârstă > 50 de ani"],1,"Risc de acidoză lactică în insuficiență renală severă; doza se reduce la eGFR 30–45."],
["Diabet zaharat","Prima măsură terapeutică în cetoacidoza diabetică este:",["Insulină subcutanată","Bicarbonat de sodiu","Fluide intravenoase (ser fiziologic), apoi insulină IV","Antibioticoterapie empirică"],2,"Reechilibrarea volemică precede insulinoterapia IV cu rată fixă; se monitorizează potasiul."],
["Hematologie","Anemia feriprivă se caracterizează prin:",["MCV crescut, feritină crescută","MCV scăzut, feritină scăzută, TIBC crescut","MCV normal, reticulocite crescute","MCV scăzut, feritină crescută"],1,"Anemie microcitară hipocromă; feritina scăzută este cel mai specific test."],
["Hematologie","Translocația t(9;22) – cromozomul Philadelphia – se asociază cu:",["Leucemia limfatică cronică","Leucemia mieloidă cronică","Limfomul Burkitt","Policitemia vera"],1,"Gena de fuziune BCR-ABL; tratament cu inhibitori de tirozin-kinază (imatinib)."],
["Hematologie","Anemia pernicioasă se asociază cu:",["Anticorpi anti-factor intrinsec","Deficit de G6PD","Mutația JAK2","Deficit de piruvat-kinază"],0,"Anticorpii anti-factor intrinsec/celule parietale duc la malabsorbție de B12 și anemie megaloblastică."],
["Boli infecțioase","Tratamentul empiric al meningitei bacteriene la adultul imunocompetent include:",["Ceftriaxonă (± dexametazonă; ampicilină la > 60 ani)","Amoxicilină orală","Ciprofloxacină","Metronidazol"],0,"Ceftriaxona IV precoce; ampicilina acoperă Listeria la vârstnici și imunodeprimați."],
["Boli infecțioase","Tratamentul de elecție al malariei severe cu Plasmodium falciparum este:",["Clorochină orală","Artesunat intravenos","Doxiciclină","Primachină"],1,"Artesunatul IV este superior chininei în malaria severă."],
["Neurologie","Fereastra terapeutică standard pentru tromboliza cu alteplază în AVC ischemic este:",["Până la 4,5 ore de la debut","Până la 24 de ore","Până la 48 de ore","Orice moment, dacă CT este normal"],0,"După excluderea hemoragiei pe CT, tromboliza IV se face în 4,5 ore; trombectomia mecanică are fereastră extinsă în ocluzii de vas mare."],
["Neurologie","Prima linie în status epilepticus este:",["Fenitoină","Benzodiazepină intravenoasă (lorazepam)","Levetiracetam oral","Propofol"],1,"Lorazepam IV (sau diazepam/midazolam), apoi antiepileptic de linia a doua."],
["Reumatologie","Anticorpii cei mai specifici pentru lupusul eritematos sistemic sunt:",["Anti-CCP","Anti-dsDNA și anti-Sm","Anti-centromer","ANCA"],1,"ANA sunt sensibili, dar nespecifici; anti-dsDNA și anti-Sm sunt specifici LES."],
["Reumatologie","Tratamentul acut al unui puseu de gută:",["Alopurinol în doză mare","AINS sau colchicină","Metotrexat","Rasburicază"],1,"Alopurinolul nu se inițiază în puseul acut; se folosesc AINS, colchicină sau corticoizi."],
["Boli osoase","Diagnosticul de osteoporoză prin DXA se pune la:",["T-score ≤ −1,0","T-score ≤ −2,5","Z-score ≤ −1,0","T-score ≥ +2,5"],1,"Osteopenie: T între −1 și −2,5; osteoporoză: ≤ −2,5."],
["Terapie intensivă","Conform Sepsis-3, sepsisul este definit ca:",["Orice infecție cu febră","Disfuncție de organ amenințătoare de viață, prin răspuns disregulat al gazdei la infecție (creștere SOFA ≥ 2)","Prezența a ≥ 2 criterii SIRS","Hipotensiune care necesită vasopresoare, fără infecție"],1,"Sepsis-3 a înlocuit definiția bazată pe SIRS; șocul septic adaugă nevoia de vasopresoare și lactat > 2 mmol/l."],
["Echilibru hidro-electrolitic și acido-bazic","Care dintre următoarele cauzează acidoză metabolică cu anion gap crescut?",["Diareea","Cetoacidoza diabetică","Acidoza tubulară renală","Pierderile gastrice prin vărsături"],1,"AG crescut: cetoacidoză, acidoză lactică, uremie, intoxicații (metanol, etilenglicol, salicilați). Diareea și ATR dau acidoză cu AG normal."],
["Terapie intensivă","Insuficiența respiratorie de tip 2 (hipercapnică) se definește prin:",["PaO₂ < 60 mmHg cu PaCO₂ normal sau scăzut","PaO₂ < 60 mmHg și PaCO₂ > 45–50 mmHg","PaCO₂ < 35 mmHg","SaO₂ > 95% cu PaCO₂ crescut"],1,"Tipul 2 apare în hipoventilație (BPOC, boli neuromusculare, depresie respiratorie)."],
["Terapie intensivă","ARDS sever, conform definiției Berlin, înseamnă un raport PaO₂/FiO₂:",["≤ 100 mmHg (cu PEEP ≥ 5)","100–200 mmHg","200–300 mmHg","> 300 mmHg"],0,"Ușor 200–300, moderat 100–200, sever ≤ 100; opacități bilaterale, edem necardiogen."],
["Hematologie","Anemia hemolitică autoimună cu anticorpi calzi se caracterizează prin:",["Coombs direct negativ","Coombs direct pozitiv (IgG); tratament inițial cu corticoizi","Prezența schizocitelor ca unic semn","Răspuns exclusiv la fier oral"],1,"Hemoliză extravasculară, sferocite, LDH și bilirubină indirectă crescute; corticoizii sunt prima linie."],
["Reumatologie","În artrita reumatoidă, anticorpul cel mai specific și medicamentul DMARD de primă linie sunt:",["ANA; hidroxiclorochină","Anti-CCP; metotrexat","Anti-dsDNA; ciclofosfamidă","HLA-B27; sulfasalazină"],1,"Anti-CCP este specific și prognostic; metotrexatul este ancora tratamentului."],

["Endocrinologie","Hipotiroidismul primar se caracterizează prin:",["TSH scăzut, FT4 crescut","TSH crescut, FT4 scăzut; tratament cu levotiroxină","TSH crescut, FT4 crescut","TSH scăzut, FT4 scăzut, tratament cu metimazol"],1,"Cea mai frecventă cauză în zonele cu iod suficient este tiroidita Hashimoto."],
["Endocrinologie","Cel mai frecvent tip de carcinom tiroidian este:",["Folicular","Papilar","Medular","Anaplazic"],1,"Carcinomul papilar are prognostic bun și diseminare limfatică."],
["Neurologie","Cea mai frecventă cauză a hemoragiei subarahnoidiene spontane este:",["Malformația arteriovenoasă","Ruptura unui anevrism sacciform","Hipertensiunea arterială","Tumora cerebrală"],1,"Cefalee brutală „în lovitură de trăsnet”; CT cranian fără contrast este primul examen."],

["Boală tromboembolică","Embolie pulmonară cu șoc / instabilitate hemodinamică. Conduita:",["Anticoagulant oral la domiciliu","Tromboliză sistemică (dacă nu există contraindicații)","Doar oxigenoterapie","Antibiotice IV"],1,"EP cu risc înalt: tromboliză și anticoagulare cu heparină; embolectomia în caz de contraindicații."],

["Cardiologie","Cel mai frecvent agent al endocarditei la consumatorii de droguri intravenos este:",["Streptococcus viridans","Staphylococcus aureus","Enterococcus faecalis","Candida albicans"],1,"Afectează frecvent valva tricuspidă; embolii septice pulmonare."],
["Cardiologie","Triada Beck (hipotensiune, jugulare turgescente, zgomote cardiace asurzite) indică:",["Embolie pulmonară","Tamponadă cardiacă (tratament: pericardiocenteză)","Infarct miocardic","Disecție de aortă"],1,"Pulsul paradoxal este semn frecvent asociat."],
["Gastroenterologie","Esofagul Barrett reprezintă:",["Inflamație eozinofilică a esofagului","Metaplazie intestinală a mucoasei esofagiene distale, cu risc de adenocarcinom","Hernie hiatală prin alunecare","Stenoză peptică"],1,"Complicație a BRGE cronic; se supraveghează endoscopic."],
["Gastroenterologie","Diagnosticul peritonitei bacteriene spontane în ciroză se pune la un număr de PMN în lichidul de ascită:",["> 250/mm³","> 50/mm³","> 5000/mm³","Orice leucocite"],0,"Se tratează cu cefalosporină de generația a III-a și albumină IV."],
["Boli hepatice","Persistența AgHBs peste 6 luni indică:",["Vindecare completă","Infecție cronică cu VHB","Imunitate vaccinală","Hepatită acută recentă"],1,"Anti-HBs izolat pozitiv indică imunitate postvaccinală."],
["Nefrologie","Sindromul nefrotic se definește prin proteinurie:",["> 150 mg/24 h","> 3,5 g/24 h, cu hipoalbuminemie, edeme și dislipidemie","> 300 mg/24 h fără edeme","Hematurie macroscopică izolată"],1,"La copil, cauza cea mai frecventă este boala cu leziuni minime (răspunde la corticoizi)."],

function home(){
const b=best(),tot=avail(),all=!sel.size;
app.innerHTML=`<h1>Grilă examen final – Medicină Clinică</h1><p class="s">Întrebări tip grilă, cu răspuns și explicație, pe tematica de rezidențiat (Kumar & Clark, Lawrence, Sinopsis de medicină).${b?` Cel mai bun scor: <b>${b}%</b>`:""}</p>
<div class="card"><div class="hd"><b>Capitole</b><span class="sm">${all?"toate capitolele":sel.size+" selectate"} · ${tot} întrebări</span></div>
<p class="hint">${all?"Apasă pe un capitol ca să exersezi doar din el. Poți adăuga mai multe.":"Apasă pe alte capitole ca să le adaugi sau scoți din selecție."}</p>
<div class="chips"><button class="chip ${all?"on":""}" data-all="1">Toate <span class="ct">${Q.length}</span></button>${CH.map(c=>`<button class="chip ${sel.has(c)?"on":""}" data-c="${c}">${c} <span class="ct">${cnt(c)}</span></button>`).join("")}</div>
<div class="row"><label>Număr întrebări: <select id="n">${[10,20,50,999].map(v=>`<option value="${v}" ${v==n?"selected":""}>${v==999?"toate ("+tot+")":v}</option>`).join("")}</select></label>
${all?"":`<button class="g" id="clr">Resetează</button>`}
<button class="p" id="go">Începe (${Math.min(n,tot)})</button></div></div>
<small>Întrebările sunt redactate pe baza capitolelor manualului; verifică întotdeauna în carte.</small>`;
app.querySelectorAll(".chip[data-c]").forEach(e=>e.onclick=()=>{const c=e.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);home()});
$("[data-all]").onclick=()=>{sel.clear();home()};
if($("#clr"))$("#clr").onclick=()=>{sel.clear();home()};
$("#n").onchange=e=>{n=+e.target.value;home()};
$("#go").onclick=start}
function start(){
pool=sh(Q.filter(q=>!sel.size||sel.has(q[0]))).slice(0,n).map(q=>{const o=q[2].map((t,k)=>[t,k==q[3]]);return{c:q[0],q:q[1],o:sh(o),e:q[4]}});
i=0;sc=0;log=[];show()}
function show(){
const q=pool[i];done=false;
app.innerHTML=`<div class="meta"><span>${q.c}</span><span>${i+1} / ${pool.length} · scor ${sc}</span></div>
<div class="bar"><i style="width:${i/pool.length*100}%"></i></div>
<div class="card"><p class="q">${q.q}</p><div id="os">${q.o.map((o,k)=>`<button class="o" data-k="${k}">${"ABCD"[k]}. ${o[0]}</button>`).join("")}</div><div id="fb"></div></div>`;
app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){
if(done)return;done=true;const q=pool[i],ok=q.o[k][1];
if(ok)sc++;log.push({q,k,ok});
app.querySelectorAll(".o").forEach((b,j)=>{b.disabled=true;if(q.o[j][1])b.classList.add("ok");else if(j==k)b.classList.add("no")});
$("#fb").innerHTML=`<div class="ex"><b>${ok?"Corect.":"Greșit."}</b> ${q.e}</div><div class="row" style="margin-top:12px"><button class="p" id="nx">${i+1<pool.length?"Următoarea":"Vezi rezultatul"}</button></div>`;
$("#nx").onclick=()=>{i++;i<pool.length?show():end()}}
function end(){
const p=Math.round(sc/pool.length*100);save(p);
const w=log.filter(l=>!l.ok);
app.innerHTML=`<div class="card"><small>Rezultat final</small><div class="big">${sc} / ${pool.length} (${p}%)</div><p>${p>=75?"Foarte bine, ești pregătit.":p>=50?"Treci, dar mai repetă capitolele greșite.":"Reia materia și încearcă din nou."}</p>
<div class="row"><button class="p" id="again">Reia</button><button class="g" id="hm">Meniu</button></div></div>
${w.length?`<div class="card"><b>De revizuit (${w.length})</b>${w.map(l=>`<div class="rv"><small>${l.q.c}</small><div>${l.q.q}</div><div><b>Ai ales:</b> ${l.q.o[l.k][0]}</div><div style="color:var(--ok)"><b>Corect:</b> ${l.q.o.find(o=>o[1])[0]}</div><small>${l.q.e}</small></div>`).join("")}</div>`:""}`;
$("#again").onclick=start;$("#hm").onclick=home}
home();
</script></body></html>
