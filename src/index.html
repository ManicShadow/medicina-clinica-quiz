["Chirurgie","După splenectomie, pacientul are risc crescut de infecții cu:",["Virusuri respiratorii","Germeni încapsulați (pneumococ, meningococ, H. influenzae)","Clostridium difficile","Candida"],1,"Se recomandă vaccinare antipneumococică, antimeningococică și anti-Hib."],
["Pediatrie","Boala Kawasaki se tratează cu:",["Corticoizi în monoterapie","Imunoglobuline IV și aspirină","Antibiotice orale","Metotrexat"],1,"Febră ≥ 5 zile; complicația majoră este anevrismul de arteră coronară."],
["Pediatrie","Stenoza hipertrofică de pilor se manifestă prin:",["Vărsături bilioase la naștere","Vărsături în jet, nebilioase, la 2–8 săptămâni, cu alcaloză hipocloremică hipokaliemică","Diaree sanguinolentă","Distensie abdominală cu meconiu absent"],1,"Palpare „oliva pilorică”; tratament: pilorotomie extramucoasă (Ramstedt) după corectarea tulburărilor."],
["Obstetrică","Tratamentul de elecție pentru prevenirea și tratarea convulsiilor în eclampsie este:",["Diazepam","Sulfat de magneziu","Fenitoină","Fenobarbital"],1,"Preeclampsia: TA ≥ 140/90 după 20 de săptămâni, cu proteinurie sau disfuncție de organ."],
["Ginecologie","Cancerul de col uterin este asociat în principal cu infecția cu:",["HPV tipurile 16 și 18","HSV-2","Chlamydia trachomatis","Candida albicans"],0,"Screening: test Babeș-Papanicolau și testare HPV; vaccinare HPV preventivă."],
["Ginecologie","Sarcina ectopică are localizarea cea mai frecventă la nivelul:",["Ovarului","Trompei uterine (porțiunea ampulară)","Colului uterin","Cavității abdominale"],1,"Întârziere menstruală + durere pelvină + sângerare; se tratează cu metotrexat dacă este stabilă și necomplicată."],
["Psihiatrie","Tratamentul de primă linie al depresiei majore este:",["Benzodiazepine","Inhibitori selectivi ai recaptării serotoninei (ISRS)","Antipsihotice tipice","Litiu"],1,"Diagnostic: simptome ≥ 2 săptămâni cu dispoziție depresivă sau anhedonie."],
["Psihiatrie","Toxicitatea cronică a litiului include:",["Hiperglicemie și obezitate","Tremor, diabet insipid nefrogen, hipotiroidism","Hipertensiune și bradicardie","Agranulocitoză"],1,"Index terapeutic îngust; se monitorizează litemia și funcția renală și tiroidiană."],
["Dermatologie","Cel mai important factor prognostic în melanomul cutanat localizat este:",["Culoarea leziunii","Grosimea Breslow","Localizarea pe trunchi","Vârsta pacientului"],1,"Regula ABCDE: asimetrie, margini, culoare, diametru, evoluție."],
["Epidemiologie","Sensibilitatea unui test diagnostic se calculează:",["VP / (VP + FN)","VN / (VN + FP)","VP / (VP + FP)","VN / (VN + FN)"],0,"Specificitatea = VN/(VN+FP); VPP = VP/(VP+FP)."]
];
const $=s=>document.querySelector(s),app=$("#app"),CH=[...new Set(Q.map(q=>q[0]))];
let sel=new Set(CH),n=10,pool=[],i=0,sc=0,log=[],done=false;
const sh=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const best=()=>{try{return localStorage.getItem("mc_best")}catch(e){return null}};
const save=p=>{try{const b=+best()||0;if(p>b)localStorage.setItem("mc_best",p)}catch(e){}};
function home(){
const b=best();
app.innerHTML=`<h1>Grilă examen final – Medicină Clinică</h1><p class="s">Întrebări tip grilă, cu răspuns și explicație, pe tematica de rezidențiat (Kumar & Clark, Lawrence, Sinopsis de medicină).${b?` Cel mai bun scor: <b>${b}%</b>`:""}</p>
<div class="card"><b>Capitole</b><div class="chips">${CH.map(c=>`<button class="chip ${sel.has(c)?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
<div class="row"><label>Număr întrebări: <select id="n">${[10,20,999].map(v=>`<option value="${v}" ${v==n?"selected":""}>${v==999?"toate":v}</option>`).join("")}</select></label>
<button class="p" id="go">Începe</button></div></div>
<small>Întrebările sunt redactate pe baza capitolelor manualului; verifică întotdeauna în carte.</small>`;
app.querySelectorAll(".chip").forEach(e=>e.onclick=()=>{const c=e.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);if(!sel.size)sel.add(c);home()});
$("#n").onchange=e=>n=+e.target.value;
$("#go").onclick=start}
function start(){
pool=sh(Q.filter(q=>sel.has(q[0]))).slice(0,n).map(q=>{const o=q[2].map((t,k)=>[t,k==q[3]]);return{c:q[0],q:q[1],o:sh(o),e:q[4]}});
i=0;sc=0;log=[];show()}
function show(){
const q=pool[i];done=false;
app.innerHTML=`<div class="meta"><span>${q.c}</span><span>${i+1} / ${pool.length} · scor ${sc}</span></div>
<div class="bar"><i style="width:${i/pool.length*100}%"></i></div>
<div class="card"><p class="q">${q.q}</p><div id="os">${q.o.map((o,k)=>`<button class="o" data-k="${k}">${"ABCD"[k]}. ${o[0]}</button>`).join("")}</div><div id="fb"></div></div>`;
app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){
if(done)return;done=true;const q=pool[i],ok=q.o[k][1];
if(ok)sc++;log.push({q,k,ok});
app.querySelectorAll(".o").forEach((b,j)=>{b.disabled=true;if(q.o[j][1])b.classList.add("ok");else if(j==k)b.classList.add("no")});
$("#fb").innerHTML=`<div class="ex"><b>${ok?"Corect.":"Greșit."}</b> ${q.e}</div><div class="row" style="margin-top:12px"><button class="p" id="nx">${i+1<pool.length?"Următoarea":"Vezi rezultatul"}</button></div>`;
$("#nx").onclick=()=>{i++;i<pool.length?show():end()}}
function end(){
const p=Math.round(sc/pool.length*100);save(p);
const w=log.filter(l=>!l.ok);
app.innerHTML=`<div class="card"><small>Rezultat final</small><div class="big">${sc} / ${pool.length} (${p}%)</div><p>${p>=75?"Foarte bine, ești pregătit.":p>=50?"Treci, dar mai repetă capitolele greșite.":"Reia materia și încearcă din nou."}</p>
<div class="row"><button class="p" id="again">Reia</button><button class="g" id="hm">Meniu</button></div></div>
${w.length?`<div class="card"><b>De revizuit (${w.length})</b>${w.map(l=>`<div class="rv"><small>${l.q.c}</small><div>${l.q.q}</div><div><b>Ai ales:</b> ${l.q.o[l.k][0]}</div><div style="color:var(--ok)"><b>Corect:</b> ${l.q.o.find(o=>o[1])[0]}</div><small>${l.q.e}</small></div>`).join("")}</div>`:""}`;
$("#again").onclick=start;$("#hm").onclick=home}
home();
</script></body></html>
